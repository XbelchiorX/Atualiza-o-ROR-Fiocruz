      <line x1="0" y1="0" x2="96" y2="0"/><line x1="0" y1="0" x2="87" y2="41"/><line x1="0" y1="0" x2="63" y2="73"/>
      <line x1="0" y1="0" x2="27" y2="92"/><line x1="0" y1="0" x2="-14" y2="95"/><line x1="0" y1="0" x2="-52" y2="81"/>
      <line x1="0" y1="0" x2="-80" y2="53"/><line x1="0" y1="0" x2="-94" y2="20"/><line x1="0" y1="0" x2="-94" y2="-20"/>
      <line x1="0" y1="0" x2="-80" y2="-53"/><line x1="0" y1="0" x2="-52" y2="-81"/><line x1="0" y1="0" x2="-14" y2="-95"/>
      <line x1="0" y1="0" x2="27" y2="-92"/><line x1="0" y1="0" x2="63" y2="-73"/><line x1="0" y1="0" x2="87" y2="-41"/>
    </g>
    <g fill="#7ee0c3">
      <circle cx="96" cy="0" r="7"/><circle cx="87" cy="41" r="7"/><circle cx="63" cy="73" r="7"/>
      <circle cx="27" cy="92" r="7"/><circle cx="-14" cy="95" r="7"/><circle cx="-52" cy="81" r="7"/>
      <circle cx="-80" cy="53" r="7"/><circle cx="-94" cy="20" r="7"/><circle cx="-94" cy="-20" r="7"/>
      <circle cx="-80" cy="-53" r="7"/><circle cx="-52" cy="-81" r="7"/><circle cx="-14" cy="-95" r="7"/>
      <circle cx="27" cy="-92" r="7"/><circle cx="63" cy="-73" r="7"/><circle cx="87" cy="-41" r="7"/>

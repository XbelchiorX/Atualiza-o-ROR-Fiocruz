<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Fiocruz no ROR: 21 unidades registradas">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b3a6e"/>
      <stop offset="0.55" stop-color="#11508f"/>
      <stop offset="1" stop-color="#1a7f6e"/>
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#ffffff" fill-opacity="0.08"/>
    </pattern>
  </defs>
  <rect width="1200" height="300" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="18" fill="url(#dots)"/>

  <!-- network motif: parent node linked to 21 children -->
  <g transform="translate(980 150)" stroke="#ffffff" stroke-opacity="0.35" stroke-width="1.6" fill="none">
    <circle r="96" stroke-dasharray="3 6"/>
  </g>

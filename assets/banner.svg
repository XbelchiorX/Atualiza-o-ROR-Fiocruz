  <text x="60" y="92" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#9fd9ff" letter-spacing="3">FUNDAÇÃO OSWALDO CRUZ</text>
  <text x="60" y="150" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="48" font-weight="800" fill="#ffffff">Atualização da Fiocruz no ROR</text>
  <text x="60" y="194" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" fill="#e6f2ff">Research Organization Registry · 20 novas unidades + ENSP atualizada</text>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" font-weight="700">
